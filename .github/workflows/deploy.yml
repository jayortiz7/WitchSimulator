name: Deploy LFS WebGL to Pages

on:
  push:
    branches:
      - main # Change this if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true # Crucial: This explicitly forces GitHub to download the real LFS files instead of pointers

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Serves your root folder files (where index.html sits)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
